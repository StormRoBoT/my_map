<!DOCTYPE html>
<html>
<head>
    <title>Penang Satellite Map</title>
    <!-- Load Leaflet Map Styles and Code -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        /* Force the map to take up the entire browser window */
        html, body, #map { 
            height: 100%; 
            width: 100%; 
            margin: 0; 
            padding: 0; 
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <!-- This div holds your map -->
    <div id="map"></div>

    <script>
        // 1. Initialize the map and set it right over the center of Penang Island (Latitude, Longitude, Zoom Level)
        var map = L.map('map').setView([5.35, 100.30], 11);

        // 2. Point to your custom processed map tiles (using the exact .jpg format generated by QGIS)
        var penangLayer = L.tileLayer('penang-tiles/{z}/{x}/{y}.jpg', {
            maxZoom: 15,
            minZoom: 10,
            attribution: 'Imagery &copy; Copernicus Sentinel data'
        });

        // 3. Drop the imagery onto your map canvas
        penangLayer.addTo(map);
    </script>
</body>
</html>
