<!DOCTYPE html>
<html>
<head>
    <title>Penang Satellite Map</title>
    <!-- Load Leaflet Map Styles and Code -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>
    <style>
        /* Force the page wrapper to fill screen bounds safely */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #dcdcdc;
        }
        /* Forces map viewport container to occupy full device screen height */
        #map { 
            height: 100vh; 
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- This div holds your map canvas -->
    <div id="map"></div>

    <script>
        // 1. Initialize the map canvas and center it right over Penang Island
        var map = L.map('map').setView([5.35, 100.30], 11);

        // 2. Point directly to your custom Copernicus tiles at the root directory
        // Using lowercase '{z}/{x}/{y}.jpg' to exactly match your '10/796/496.jpg' structure
        var mySatelliteLayer = L.tileLayer('{z}/{x}/{y}.jpg', {
            maxZoom: 15,
            minZoom: 10,
            attribution: 'Imagery &copy; Copernicus Sentinel data'
        });
        mySatelliteLayer.addTo(map);

        // 3. BASE BACKGROUND STREET MAP (Fallback)
        // This drops a background world street map underneath your custom imagery. 
        // It guarantees your screen will immediately show a working map interface instead of going blank.
        var backupStreetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });
        backupStreetLayer.addTo(map);
    </script>
</body>
</html>
