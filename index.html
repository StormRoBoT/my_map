<!DOCTYPE html>
<html>
<head>
    <title>Penang Satellite Map</title>
    <!-- Load Official Leaflet Components -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #eaeaea;
        }
        #map { 
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        // 1. Initialize map canvas centered directly over Penang Island
        var map = L.map('map').setView([5.35, 100.30], 11);

        // 2. Base Background Street Map Layer
        var backupStreetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        });
        backupStreetLayer.addTo(map);

        // 3. CRITICAL PATH FIX: Matches your double-nested folder structure perfectly!
        var mySatelliteLayer = L.tileLayer('penang-tiles/penang-tiles/{z}/{x}/{y}.jpg', {
            maxZoom: 15,
            minZoom: 10,
            attribution: 'Imagery &copy; Copernicus'
        });
        mySatelliteLayer.addTo(map);
    </script>
</body>
</html>
