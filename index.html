<!DOCTYPE html>
<html>
<head>
    <title>Penang Satellite Map</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        #map { height: 100vh; width: 100%; margin: 0; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        // Centers the map right over Penang Island
        var map = L.map('map').setView([5.35, 100.30], 11);

        // Point to your custom processed map tiles
        var penangLayer = L.tileLayer('penang-tiles/{z}/{x}/{y}.jpg', {
            maxZoom: 15,
            minZoom: 10,
            attribution: 'Imagery &copy; Copernicus Sentinel data'
        });

        penangLayer.addTo(map);
    </script>
</body>
</html>
