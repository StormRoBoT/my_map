<!DOCTYPE html>
<html>
<head>
    <title>Penang Satellite Map</title>
    <!-- Load Leaflet Map Styles and Code -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>
    <style>
        /* Force the map to fill the entire browser window */
        html, body, #map { 
            height: 100%; 
            width: 100%; 
            margin: 0; 
            padding: 0; 
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <!-- This div holds your map canvas -->
    <div id="map"></div>

    <script>
        // 1. Initialize the map and center it directly over Penang Island (Zoom level 11)
        var map = L.map('map').setView([5.35, 100.30], 11);

        // 2. Point to YOUR custom Copernicus satellite tiles using lowercase .jpg extension
        var mySatelliteLayer = L.tileLayer('{z}/{x}/{y}.jpg', {
            maxZoom: 15,
            minZoom: 10,
            attribution: 'Imagery &copy; Copernicus Sentinel data'
        });

        // 3. Drop your custom satellite layer onto the map
        mySatelliteLayer.addTo(map);

        // 4. EMERGENCY FALLBACK LAYER (OpenStreetMap)
        // If your custom tiles fail to load, this standard street map layer will show up underneath 
        // so you know your code works and only the images have a path/naming problem.
        var backupStreetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });
        
        // This adds the backup street layer underneath your satellite image grid
        backupStreetLayer.addTo(map);
    </script>
</body>
</html>
