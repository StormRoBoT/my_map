<!DOCTYPE html>
<html>
<head>
    <title>My Simple Satellite Map</title>
    <!-- Load Leaflet Map Styles and Code -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        #map { height: 100vh; width: 100%; margin: 0; }
    </style>
</head>
<body>

    <!-- This div holds your map -->
    <div id="map"></div>

    <script>
        // 1. Initialize the map and set it to a starting position (Latitude, Longitude, Zoom Level)
        var map = L.map('map').setView([0, 0], 2);

        // 2. Point to a free open-source satellite tile layer (Esri World Imagery is free for basic use)
        var satelliteLayer = L.tileLayer('https://arcgisonline.com{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        // 3. Drop the imagery onto your map
        satelliteLayer.addTo(map);
    </script>
</body>
</html>
