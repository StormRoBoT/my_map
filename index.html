<!DOCTYPE html>
<html>
<head>
    <title>Penang Satellite Map</title>
    <!-- Load Leaflet Map Styles and Code -->
    <link rel="stylesheet" href="https://cloudflare.com" />
    <script src="https://cloudflare.com"></script>
    <style>
        /* Force the page wrapper to fill screen bounds safely */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #dcdcdc; /* Gray background reveals if layout is working */
        }
        /* CRITICAL FIX: Forces map viewport container to occupy full device screen height */
        #map { 
            height: 100vh; 
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- This div holds your map canvas -->
    <div id="map"></div>

    <script>
        // 1. Initialize the map canvas centered over Penang Island
        var map = L.map('map').setView([5.35, 100.30], 11);

        // 2. Point to YOUR custom Copernicus satellite tiles (lowercase .jpg extension format)
        var mySatelliteLayer = L.tileLayer('{z}/{x}/{y}.jpg', {
            maxZoom: 15,
            minZoom: 10,
            attribution: 'Imagery &copy; Copernicus Sentinel data'
        });
        mySatelliteLayer.addTo(map);

        // 3. EMERGENCY FALLBACK LAYER (OpenStreetMap)
        // If your custom satellite tiles fail to load, this will display standard roads underneath
        var backupStreetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        });
        backupStreetLayer.addTo(map);
    </script>
</body>
</html>
