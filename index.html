<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Penang Live Satellite Map</title>
    
    <!-- Official Leaflet Engine Files Hosted Safely via UNPKG CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <style>
        /* Force screen containment rules directly */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #dcdcdc; /* Gray reveal grid layout */
        }
        #map { 
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Target map rendering frame box -->
    <div id="map"></div>

    <script>
        // 1. Initialize the Leaflet framework engine over Penang Island
        var map = L.map('map').setView([5.35, 100.30], 11);

        // 2. Load the Emergency Fallback base layer first to secure layout trees
        var backupStreetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        });
        backupStreetLayer.addTo(map);

        // 3. Render your custom double-nested Copernicus photo grid path layout
        var mySatelliteLayer = L.tileLayer('penang-tiles/penang-tiles/{z}/{x}/{y}.jpg', {
            maxZoom: 15,
            minZoom: 10,
            attribution: 'Imagery &copy; Copernicus'
        });
        mySatelliteLayer.addTo(map);
    </script>
</body>
</html>
